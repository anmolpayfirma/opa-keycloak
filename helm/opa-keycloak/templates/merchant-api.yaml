{{- if .Values.merchantApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: merchant-api
    version: v1
spec:
  replicas: {{ .Values.merchantApi.replicas | default 1 }}
  selector:
    matchLabels:
      app: merchant-api
      version: v1
  template:
    metadata:
      labels:
        app: merchant-api
        version: v1
    spec:
      containers:
      - name: merchant-api
        image: "{{ .Values.merchantApi.image.repository }}:{{ .Values.merchantApi.image.tag }}"
        ports:
        - containerPort: 8080
        resources:
          {{- toYaml .Values.merchantApi.resources | nindent 10 }}
        env:
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /api/v1/merchants/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/merchants/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-api-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: merchant-api
spec:
  selector:
    app: merchant-api
  ports:
  - port: 8080
    targetPort: 8080
    name: http
{{- end }}

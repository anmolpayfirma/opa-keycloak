{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: opa-demo-gateway
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - {{ .Values.global.domain }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: opa-demo-vs
  namespace: {{ .Values.global.namespace }}
spec:
  hosts:
  - {{ .Values.global.domain }}
  gateways:
  - opa-demo-gateway
  http:
  # Keycloak routes
  - match:
    - uri:
        prefix: /auth
    route:
    - destination:
        host: keycloak-service
        port:
          number: 8080
  # Employee API routes
  - match:
    - uri:
        prefix: /api/v1/employees
    route:
    - destination:
        host: auth-service
        port:
          number: 80
  # Health check route
  - match:
    - uri:
        exact: /health
    route:
    - destination:
        host: employee-api-service
        port:
          number: 8080
  # OPA routes
  - match:
    - uri:
        prefix: /opa
    rewrite:
      uri: /
    route:
    - destination:
        host: opa-service
        port:
          number: 8181
{{- end }} 
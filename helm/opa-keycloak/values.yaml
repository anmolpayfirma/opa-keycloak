# Default values for opa-keycloak
# This is a YAML-formatted file.

global:
  # Set to true if running in cloud minikube
  cloudMinikube: true
  # Domain for ingress
  domain: opa-demo.local
  # Namespace to deploy to
  namespace: opa-keycloak
  # Registry for images
  registry: localhost:5000

# PostgreSQL Configuration
postgresql:
  enabled: true
  image: postgres:15-alpine
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 5432
  # Database credentials (base64 encoded in secrets)
  auth:
    postgresUser: postgres
    postgresPassword: postgres123
    database: opa_demo
    # Service-specific database users
    keycloakUser: keycloak
    keycloakPassword: keycloak123
    keycloakDatabase: keycloak
    employeeApiUser: employee_api
    employeeApiPassword: employee123
    employeeApiDatabase: employee_api

# Keycloak Configuration
keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:23.0
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  admin:
    username: admin
    password: admin123
  service:
    type: ClusterIP
    port: 8080

# OPA Configuration
opa:
  enabled: true
  image: openpolicyagent/opa:latest-envoy
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8181

# Auth Service Configuration
authService:
  enabled: true
  image: localhost:5000/auth-service:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8080

# Employee API Configuration
employeeApi:
  enabled: true
  image: localhost:5000/employee-api:v2.0.0
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8080
  # PostgreSQL connection settings
  database:
    host: postgresql-service
    port: 5432
    name: employee_api
    user: employee_api

# Kong Gateway Configuration (removed - using Istio Gateway instead)

# Istio Configuration
istio:
  enabled: true
  gateway:
    name: opa-demo-gateway
  virtualService:
    name: opa-demo-vs

# Nginx Ingress Configuration (removed - using Istio Gateway instead)

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false

# Pod Security Context
podSecurityContext:
  fsGroup: 1000

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Autoscaling (disabled by default)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80 
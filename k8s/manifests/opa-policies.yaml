apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: default
data:
  employee-authz.rego: |
    package employee.authz

    import rego.v1

    default allow := false

    # Allow access to health endpoint without authentication
    allow if {
        input.path == "/health"
    }

    # Extract JWT token and decode it
    token := t if {
        [_, encoded] := split(input.token, " ")
        [_, payload, _] := io.jwt.decode(encoded)
        t := payload
    }

    # Allow managers to access any employee record
    allow if {
        token.realm_access.roles[_] == "manager"
        startswith(input.path, "/api/v1/employees/")
    }

    # Allow employees to access only their own records
    allow if {
        token.realm_access.roles[_] == "employee"
        startswith(input.path, "/api/v1/employees/")
        employee_path_id := substring(input.path, 18, -1)  # Extract ID from "/api/v1/employees/{id}"
        token.employee_id == employee_path_id
    }

    # Allow access to employee list for managers
    allow if {
        token.realm_access.roles[_] == "manager"
        input.path == "/api/v1/employees"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: default
  labels:
    app: opa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
      - name: opa
        image: openpolicyagent/opa:latest-envoy
        ports:
        - containerPort: 8181
        args:
          - "run"
          - "--server"
          - "--addr=0.0.0.0:8181"
          - "/policies/employee-authz.rego"
        volumeMounts:
        - name: opa-policies
          mountPath: /policies
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: opa-policies
        configMap:
          name: opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: opa-service
  namespace: default
  labels:
    app: opa
spec:
  selector:
    app: opa
  ports:
  - port: 8181
    targetPort: 8181
  type: ClusterIP
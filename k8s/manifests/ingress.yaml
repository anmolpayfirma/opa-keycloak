apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opa-demo-health
  namespace: opa-keycloak-practice
spec:
  ingressClassName: nginx
  rules:
  - host: opa-demo.local
    http:
      paths:
      # Health check - no rewrite needed
      - path: /health
        pathType: Exact
        backend:
          service:
            name: employee-api-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opa-demo-employees
  namespace: opa-keycloak-practice
spec:
  ingressClassName: nginx
  rules:
  - host: opa-demo.local
    http:
      paths:
      # Employee API routes - no rewrite needed for /employees
      - path: /employees
        pathType: Prefix
        backend:
          service:
            name: employee-api-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opa-demo-keycloak
  namespace: opa-keycloak-practice
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: opa-demo.local
    http:
      paths:
      # Keycloak routes - rewrite /auth/... to /...
      - path: /auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: keycloak-service
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opa-demo-opa
  namespace: opa-keycloak-practice
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: opa-demo.local
    http:
      paths:
      # OPA service for debugging - rewrite /opa/... to /...
      - path: /opa(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: opa-service
            port:
              number: 8181 
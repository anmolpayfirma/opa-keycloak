apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
  namespace: opa-keycloak-practice
  labels:
    app: employee-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-api
  template:
    metadata:
      labels:
        app: employee-api
    spec:
      containers:
      - name: employee-api
        image: localhost:5000/employee-api:v1.0.1
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: OPA_SERVICE_HOST
          value: "opa-service.opa-keycloak-practice.svc.cluster.local"
        - name: OPA_SERVICE_PORT
          value: "8181"
        - name: APP_VERSION
          value: "1.0.1"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: employee-api-service
  namespace: opa-keycloak-practice
  labels:
    app: employee-api
spec:
  selector:
    app: employee-api
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP 
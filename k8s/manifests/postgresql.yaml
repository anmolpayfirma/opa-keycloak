apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: default
type: Opaque
data:
  # postgres / postgres123
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXMxMjM=
  POSTGRES_DB: b3BhX2RlbW8=
  # keycloak / keycloak123  
  KEYCLOAK_DB_USER: a2V5Y2xvYWs=
  KEYCLOAK_DB_PASSWORD: a2V5Y2xvYWsxMjM=
  KEYCLOAK_DB_NAME: a2V5Y2xvYWs=
  # employee_api / employee123
  EMPLOYEE_API_DB_USER: ZW1wbG95ZWVfYXBp
  EMPLOYEE_API_DB_PASSWORD: ZW1wbG95ZWUxMjM=
  EMPLOYEE_API_DB_NAME: ZW1wbG95ZWVfYXBp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: default
data:
  01-init-databases.sql: |
    -- Create databases and users for our services
    
    -- Keycloak database
    CREATE DATABASE keycloak;
    CREATE USER keycloak WITH ENCRYPTED PASSWORD 'keycloak123';
    GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
    ALTER DATABASE keycloak OWNER TO keycloak;
    
    -- Employee API database  
    CREATE DATABASE employee_api;
    CREATE USER employee_api WITH ENCRYPTED PASSWORD 'employee123';
    GRANT ALL PRIVILEGES ON DATABASE employee_api TO employee_api;
    ALTER DATABASE employee_api OWNER TO employee_api;
    
  02-seed-employee-data.sql: |
    -- Connect to employee_api database and create schema
    \c employee_api;
    
    -- Create employees table
    CREATE TABLE IF NOT EXISTS employees (
        id VARCHAR(20) PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        department VARCHAR(50) NOT NULL,
        email VARCHAR(100),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create departments table
    CREATE TABLE IF NOT EXISTS departments (
        id VARCHAR(20) PRIMARY KEY,
        name VARCHAR(50) NOT NULL,
        description TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Seed departments
    INSERT INTO departments (id, name, description) VALUES 
        ('ENG', 'Engineering', 'Software development and technical teams'),
        ('MKT', 'Marketing', 'Marketing and brand management'),
        ('MGT', 'Management', 'Leadership and executive team'),
        ('HR', 'Human Resources', 'People operations and talent management')
    ON CONFLICT (id) DO NOTHING;
    
    -- Seed employees
    INSERT INTO employees (id, name, department, email) VALUES 
        ('EMP001', 'John Doe', 'Engineering', 'john.doe@company.com'),
        ('EMP002', 'Jane Smith', 'Marketing', 'jane.smith@company.com'),
        ('EMP003', 'Bob Employee', 'Engineering', 'bob@company.com'),
        ('MGR001', 'Alice Manager', 'Management', 'alice@company.com'),
        ('EMP004', 'Sarah Developer', 'Engineering', 'sarah.dev@company.com'),
        ('EMP005', 'Mike Sales', 'Marketing', 'mike.sales@company.com')
    ON CONFLICT (id) DO NOTHING;
    
    -- Grant permissions to employee_api user
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO employee_api;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO employee_api;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: default
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/postgresql/data
        - name: postgresql-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-pvc
      - name: postgresql-init
        configMap:
          name: postgresql-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: default
  labels:
    app: postgresql
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  type: ClusterIP 
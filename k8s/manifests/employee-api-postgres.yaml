apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
  namespace: default
  labels:
    app: employee-api
    version: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-api
  template:
    metadata:
      labels:
        app: employee-api
        version: postgres
    spec:
      containers:
      - name: employee-api
        image: localhost:5000/employee-api:v2.0.0-postgres
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: APP_VERSION
          value: "2.0.0-postgres"
        - name: DB_HOST
          value: "postgresql-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: EMPLOYEE_API_DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: EMPLOYEE_API_DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: EMPLOYEE_API_DB_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: employee-api-service
  namespace: default
  labels:
    app: employee-api
spec:
  selector:
    app: employee-api
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP 
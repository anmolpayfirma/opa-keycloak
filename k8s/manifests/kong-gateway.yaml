apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: default
data:
  kong.conf: |
    database = off
    declarative_config = /kong/declarative/kong.yml
    proxy_listen = 0.0.0.0:8000
    admin_listen = 0.0.0.0:8001
    log_level = info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: default
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    
    services:
    - name: keycloak-service
      url: http://keycloak-service.default.svc.cluster.local:8080
      
    - name: employee-api-service
      url: http://employee-api-service.default.svc.cluster.local:80
      
    - name: opa-service
      url: http://opa-service.default.svc.cluster.local:8181
    
    routes:
    - name: keycloak-route
      service: keycloak-service
      paths:
      - /auth
      strip_path: true
      
    - name: employee-api-route
      service: employee-api-service
      paths:
      - /api/v1/employees
      strip_path: false
      
    - name: health-route
      service: employee-api-service
      paths:
      - /health
      strip_path: false
      
    - name: opa-route
      service: opa-service
      paths:
      - /opa
      strip_path: true
      
    plugins:
    - name: cors
      config:
        origins:
        - "*"
        methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        exposed_headers:
        - X-Auth-Token
        credentials: true
        max_age: 3600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  namespace: default
  labels:
    app: kong-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-gateway
  template:
    metadata:
      labels:
        app: kong-gateway
    spec:
      containers:
      - name: kong
        image: kong:3.4
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: "/kong/declarative/kong.yml"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"
        - name: KONG_LOG_LEVEL
          value: "info"
        - name: KONG_PLUGINS
          value: "bundled"
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8001
          name: admin
        volumeMounts:
        - name: kong-declarative-config
          mountPath: /kong/declarative
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: kong-declarative-config
        configMap:
          name: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-gateway-service
  namespace: default
  labels:
    app: kong-gateway
spec:
  selector:
    app: kong-gateway
  ports:
  - name: proxy
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: admin
    port: 8001
    targetPort: 8001
    protocol: TCP
  type: ClusterIP 
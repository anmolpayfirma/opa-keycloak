# employee-api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
  namespace: opa-keycloak-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-api
  template:
    metadata:
      labels:
        app: employee-api
    spec:
      containers:
      - name: employee-api
        image: python:3.9-alpine
        ports:
        - containerPort: 8080
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install requests
            mkdir -p /app
            
            cat > /app/api.py << 'EOF'
            #!/usr/bin/env python3
            import json
            import requests
            from http.server import HTTPServer, BaseHTTPRequestHandler
            from urllib.parse import urlparse, parse_qs
            import re
            
            class EmployeeAPIHandler(BaseHTTPRequestHandler):
                def do_GET(self):
                    self.handle_request()
                
                def do_POST(self):
                    self.handle_request()
                
                def do_PUT(self):
                    self.handle_request()
                
                def do_DELETE(self):
                    self.handle_request()
                
                def handle_request(self):
                    # Get authorization header
                    auth_header = self.headers.get('Authorization', '')
                    if not auth_header.startswith('Bearer '):
                        self.send_error_response(401, 'Missing or invalid authorization header')
                        return
                    
                    token = auth_header[7:]  # Remove 'Bearer ' prefix
                    
                    # Check authorization with OPA
                    if not self.check_authorization(token):
                        self.send_error_response(403, 'Access denied')
                        return
                    
                    # Handle the request
                    if self.path == '/employees':
                        self.handle_employees_list()
                    elif self.path.startswith('/employees/'):
                        employee_id = self.path.split('/')[-1]
                        self.handle_employee_detail(employee_id)
                    else:
                        self.send_error_response(404, 'Not found')
                
                def check_authorization(self, token):
                    try:
                        opa_url = 'http://opa-service.opa-keycloak-practice.svc.cluster.local:8181/v1/data/system/authz/allow'
                        payload = {
                            'input': {
                                'method': self.command,
                                'path': self.path,
                                'token': token
                            }
                        }
                        
                        response = requests.post(opa_url, json=payload, timeout=5)
                        if response.status_code == 200:
                            result = response.json()
                            return result.get('result', False)
                        return False
                    except Exception as e:
                        print(f"Authorization error: {e}")
                        return False
                
                def handle_employees_list(self):
                    employees = [
                        {"id": "EMP001", "name": "John Manager", "department": "Engineering"},
                        {"id": "EMP002", "name": "Jane HR", "department": "HR"},
                        {"id": "EMP003", "name": "Bob Employee", "department": "Engineering"}
                    ]
                    self.send_json_response(200, {"employees": employees})
                
                def handle_employee_detail(self, employee_id):
                    employees = {
                        "EMP001": {"id": "EMP001", "name": "John Manager", "department": "Engineering"},
                        "EMP002": {"id": "EMP002", "name": "Jane HR", "department": "HR"},
                        "EMP003": {"id": "EMP003", "name": "Bob Employee", "department": "Engineering"}
                    }
                    
                    if employee_id in employees:
                        self.send_json_response(200, {"employee": employees[employee_id]})
                    else:
                        self.send_error_response(404, 'Employee not found')
                
                def send_json_response(self, status_code, data):
                    self.send_response(status_code)
                    self.send_header('Content-Type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps(data).encode())
                
                def send_error_response(self, status_code, message):
                    self.send_response(status_code)
                    self.send_header('Content-Type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({"error": message}).encode())
                
                def log_message(self, format, *args):
                    print(f"{self.address_string()} - {format % args}")
            
            if __name__ == '__main__':
                server = HTTPServer(('0.0.0.0', 8080), EmployeeAPIHandler)
                print("Employee API starting on port 8080...")
                server.serve_forever()
            EOF
            
            python /app/api.py
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: opa-keycloak-practice
data:
  placeholder: "removed"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-content
  namespace: opa-keycloak-practice
data:
  placeholder: "removed"
---
apiVersion: v1
kind: Service
metadata:
  name: employee-api-service
  namespace: opa-keycloak-practice
spec:
  selector:
    app: employee-api
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
